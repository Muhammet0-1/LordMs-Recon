[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lordms-recon"
version = "1.0.0"
description = "Authorization-first reconnaissance and target-prioritization CLI for bug bounty workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Muhammet (LordMs)" }]
keywords = ["cybersecurity", "reconnaissance", "bug-bounty", "subdomains", "security-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["Flask>=3.0,<4"]

[project.scripts]
lordms-recon = "lordms_recon.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/Muhammet0-1/LordMs-Recon"
Issues = "https://github.com/Muhammet0-1/LordMs-Recon/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
